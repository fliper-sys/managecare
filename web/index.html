  <meta name="apple-mobile-web-app-title" content="Manage Care">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Manage Care</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #loading-container {
      text-align: center;
      color: white;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 30px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 40px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="logo">📦</div>
    <div class="title">Manage Care</div>
    <div class="subtitle">Initializing application...</div>
    <div class="spinner"></div>
  </div>

  <script>
    // One-time cleanup: unregister any service worker + caches left over from
    // builds before --pwa-strategy=none, so returning users don't get stuck
    // on a stale cached app shell.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(registration) {
          registration.unregister();
        });
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        keys.forEach(function(key) {
          caches.delete(key);
        });
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
  <script type="module" src="js/web_usb_printer.js"></script>

          import('https://www.gstatic.com/firebasejs/12.6.0/firebase-analytics.js'),

        const firebaseConfig = {
          apiKey: 'AIzaSyBR-KdYr8jtTjatQgrdNNtGRcGIAQYgaXA',
          authDomain: 'manage-care-1e96b.firebaseapp.com',
          databaseURL: 'https://manage-care-1e96b-default-rtdb.firebaseio.com',
          projectId: 'manage-care-1e96b',
          storageBucket: 'manage-care-1e96b.firebasestorage.app',
          messagingSenderId: '481744910720',
          appId: '1:481744910720:web:8ee6d70263346747b92965',
          measurementId: 'G-DZ3CE9LWYT',
        };

        const app = initializeApp(firebaseConfig);
        getAnalytics(app);
      } catch (error) {
        console.warn('Firebase analytics load failed:', error);
      }

    initFirebaseAnalytics();
  </script>
  <script>
    window.addEventListener('load', function() {
      // Hide loading screen after Flutter initializes (10 seconds max)
      setTimeout(function() {
        const loadingContainer = document.getElementById('loading-container');
        if (loadingContainer) {
          loadingContainer.style.display = 'none';
        }
      }, 10000);
    });
  </script>

</body>
