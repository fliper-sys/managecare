version: '3.9'
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: managecare
      POSTGRES_USER: managecare
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  api:
    build: .
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: managecare
      DB_USER: managecare
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 4000
    depends_on:
      - postgres

volumes:
  postgres-data:
