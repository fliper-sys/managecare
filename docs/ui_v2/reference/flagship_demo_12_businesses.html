    body {

    /* Atmospheric Studio Ambient Mesh */
    .studio-mesh {
      background-color: #EAEFF6;
      background-image:
        radial-gradient(at 12% 18%, rgba(37, 99, 235, 0.14) 0px, transparent 48%),
        radial-gradient(at 88% 14%, rgba(16, 185, 129, 0.11) 0px, transparent 44%),
        radial-gradient(at 78% 85%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
    }
    .dark .studio-mesh {
      background-color: #04070F;
      background-image:
        radial-gradient(at 14% 16%, rgba(37, 99, 235, 0.22) 0px, transparent 52%),
        radial-gradient(at 86% 18%, rgba(16, 185, 129, 0.12) 0px, transparent 46%),
        radial-gradient(at 76% 86%, rgba(79, 70, 229, 0.18) 0px, transparent 54%);
    }

    /* Subtle Micro-Noise Grain Overlay */
    .micro-grain::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.028;
      z-index: 60;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");

    /* Specular 1px Top/Left Hairline Border Mask */

    }
    .glass-hairline::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,0.68), rgba(255,255,255,0.08) 45%, rgba(148,163,184,0.18));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);

      mask-composite: exclude;
      pointer-events: none;

    .dark .glass-hairline::before {

    /* Tactile Spring Detents */
    .tactile-btn {

        transform: translate3d(0, 0, 0);

    .pulse-beacon::before {
      content: '';

      background-color: currentColor;
      animation: pulseRing 2s infinite;

    /* Perforated Thermal Receipt Serrated Edges */
    .receipt-top-edge {

    .dark .receipt-top-edge {
      background-image: radial-gradient(circle at 8px 0px, transparent 5px, #020617 5.4px);
    }
    .receipt-bottom-edge {
      height: 8px;
      background-image: radial-gradient(circle at 8px 8px, transparent 5px, #FAFBFD 5.4px);
      background-size: 16px 8px;
      background-repeat: repeat-x;
    }
    .dark .receipt-bottom-edge {
      background-image: radial-gradient(circle at 8px 8px, transparent 5px, #020617 5.4px);
    }

    /* Swipeable Row Spring Transition */
    .swipe-fg {
      transition: transform calc(0.36s * var(--motion-scale)) var(--spring-bounce);
      touch-action: pan-y;
    }
    .swipe-fg.dragging {
      transition: none;
    }

      '<div class="flex items-end justify-between pt-3"><span class="text-[12px] font-bold text-slate-500 dark:text-slate-400">Total today</span><span class="text-[26px] font-extrabold font-mono tabular-nums">' + money(p.v) + '</span></div>' +
      '<p class="text-[11px] text-slate-500 dark:text-slate-400 pt-1">You will see this summary again on the payment page. Nothing is charged in this demo.</p>' +
      '<button data-act="payplan" class="tactile-btn w-full mt-3 py-3.5 rounded-2xl text-[13px] font-extrabold text-white" style="background:var(--ac)">Confirm and pay</button>';
  }
  function searchSheet() {
    return '<div class="flex items-center gap-2 pb-2"><div class="relative flex-1"><input id="spot" autocomplete="off" placeholder="Search ' + esc(D().name.toLowerCase()) + '" class="w-full h-11 pl-10 pr-3 rounded-2xl bg-slate-100 dark:bg-slate-800 text-[14px] outline-none border border-transparent focus:border-[var(--ac)]" aria-label="Search"><span class="absolute left-3.5 top-3 text-slate-400">' + ic('search', 'w-5 h-5') + '</span></div><button data-act="close" class="tactile-btn px-2 text-[12px] font-extrabold" style="color:var(--ac)">Cancel</button></div><div id="spotRes" class="overflow-y-auto phone-scroll flex-1 min-h-0"></div>';
  }
  function spotResults(q) {
    var d = D(), out = [], ql = q.toLowerCase();

  }
  function notifSheet() {
    var d = D(), f = F(), n = [[d.low[0][0], d.low[0][1], 'warn'], [d.pend[0][0], d.pend[0][1] + ' waiting', 'info'], ['Plan renews ' + fmtDate(addDays(f.days)), f.label + ' · ' + f.current, 'ok']];

  }
  function exportSheet() {
    return '<div class="flex items-center justify-between pb-2"><h2 class="text-[17px] font-extrabold">Export report</h2><button data-act="close" class="tactile-btn w-9 h-9 rounded-xl bg-slate-200/80 dark:bg-slate-800 flex items-center justify-center" aria-label="Close">' + ic('x', 'w-4 h-4') + '</button></div><div class="space-y-2">' + ['PDF summary', 'Spreadsheet (CSV)', 'Email to accountant'].map(function (n) { return '<button data-act="exported" data-n="' + n + '" class="tactile-btn w-full text-left rounded-2xl p-3.5 bg-slate-100 dark:bg-slate-800 text-[13px] font-bold">' + n + '</button>'; }).join('') + '</div>';
  }
  var SHEETS = { pos: [posSheet, 'max-h-[92%] flex flex-col h-[88%]'], receipt: [receiptSheet, ''], confirm: [confirmSheet, ''], search: [searchSheet, 'flex flex-col h-[80%]'], notif: [notifSheet, ''], export: [exportSheet, ''] };
  function openSheet(name) {
    var s = SHEETS[name]; S.sheet = name;
    $('#sheetHost').innerHTML = '<div id="sheet" role="dialog" aria-modal="true" class="sheet-animate absolute bottom-0 left-0 right-0 z-50 bg-white dark:bg-slate-900 rounded-t-[32px] border-t border-slate-200 dark:border-slate-800 p-4 pb-5 shadow-2xl ' + s[1] + '">' + s[0]() + '</div>';

  }
  function closeSheets() { S.sheet = null; $('#sheetHost').innerHTML = ''; $('#sheetBackdrop').classList.add('hidden'); }
  function refreshPos() {
    $('#itemList').innerHTML = itemsHTML(); var t = $('#cartTot'); if (t) t.textContent = money(cartTotal());
  }

  /* ---------- events ---------- */
  function setTab(t) {
    if (t === 'sales') { openSheet('pos'); return; }
    S.tab = t; S.filter = 0; render(false);
  }
  function setBiz(k, first) {
    S.biz = k; S.tab = 'home'; S.filter = 0; S.cart = {}; S.ws = false; S.pay = 0; S.q = ''; S.tier = null; S.term = 3; closeSheets();
    renderDock(); render(!first);
    if (!first) island(IND[k].name, F().label, 'SWITCH', 'info');
  }
  document.addEventListener('click', function (e) {
    var tb = e.target.closest('[data-tab]'); if (tb) { setTab(tb.getAttribute('data-tab')); return; }
    var bz = e.target.closest('[data-biz]'); if (bz) { setBiz(bz.getAttribute('data-biz')); return; }
    var a = e.target.closest('[data-act]'); if (!a) { if (e.target.id === 'sheetBackdrop') closeSheets(); return; }
    var act = a.getAttribute('data-act'), d = D(), f = F();
    if (act === 'close') closeSheets();
    else if (act === 'search') openSheet('search');
    else if (act === 'notif') openSheet('notif');
    else if (act === 'goplan') setTab('plan');
    else if (act === 'qa') {
      var i = +a.getAttribute('data-i'), q = d.qa[i];
      if (q[1] === 'Reports') setTab('reports'); else if (d.qaGo[i] === 'sales') openSheet('pos'); else if (d.qaGo[i] === 'work') setTab('work');
      else if (q[1] === 'Due dates' || q[1] === 'Kitchen' || q[1] === 'Today' || q[1] === 'Open tabs' || q[1] === 'Housekeeping' || q[1] === 'Shifts' || q[1] === 'Crop cycles' || q[1] === 'Maintenance' || q[1] === 'Classes' || q[1] === 'Vehicles' || q[1] === 'Stock count' || q[1] === 'Expiry check') setTab('work');
      else island(q[1], 'Opens its own screen in the full app', 'DEMO', 'info');
    }
    else if (act === 'rowdone') dismiss(a.getAttribute('data-key'));
    else if (act === 'filter') { S.filter = +a.getAttribute('data-i'); render(false); }
    else if (act === 'period') { S.period = +a.getAttribute('data-i'); render(false); }
    else if (act === 'export') openSheet('export');
    else if (act === 'exported') { closeSheets(); island('Report ready', a.getAttribute('data-n'), 'EXPORT', 'ok'); }
    else if (act === 'term') { S.term = +a.getAttribute('data-i'); render(false); }
    else if (act === 'tier') { S.tier = a.getAttribute('data-id'); render(false); $('#viewportScroll').scrollTop = 99999; }
    else if (act === 'confirmplan') openSheet('confirm');
    else if (act === 'contact') island('Quote requested', 'We will call you within a day', 'SENT', 'ok');
    else if (act === 'payplan') { var t = f.tiers.filter(function (x) { return x.id === S.tier; })[0]; closeSheets(); island('Plan updated', f.label + ' · ' + t.name, 'PAID', 'ok'); }
    else if (act === 'ws') { S.ws = a.getAttribute('data-i') === '1'; openSheet('pos'); }
    else if (act === 'pay') { S.pay = +a.getAttribute('data-i'); var sc = $('#itemList').scrollTop; openSheet('pos'); $('#itemList').scrollTop = sc; }
    else if (act === 'qty') {
      var k = a.getAttribute('data-k'), dl = +a.getAttribute('data-d'); S.cart[k] = Math.max(0, (S.cart[k] || 0) + dl);
      var qe = $('#qty' + k); if (qe) { qe.textContent = S.cart[k]; qe.classList.remove('qty-pop'); void qe.offsetWidth; qe.classList.add('qty-pop'); }
      var tot = $('#cartTot'); if (tot) tot.textContent = money(cartTotal());
    }
    else if (act === 'pay-go') {
      var lines = cartLines(); if (!lines.length) { island('Cart is empty', 'Add something first', 'EMPTY', 'warn'); return; }
      S.receipt = { lines: lines, total: cartTotal(), method: d.methods[S.pay], inv: S.inv, no: d.docPrefix + String(1040 + Math.floor(Math.random() * 90)), time: new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) };
      S.cart = {}; openSheet('receipt'); island(d.doneTitle, money(S.receipt.total) + ' · ' + S.receipt.no, 'SAVED', 'ok');
    }
    else if (act === 'again') { openSheet('pos'); }
    else if (act === 'spot') {
      if (a.getAttribute('data-t') === 'item') { S.cart[a.getAttribute('data-k')] = (S.cart[a.getAttribute('data-k')] || 0) + 1; openSheet('pos'); } else { closeSheets(); setTab('work'); }
    }
  });
  document.addEventListener('input', function (e) {

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sheet) closeSheets(); });

  /* ---------- dock ---------- */
  var order = ['administrative', 'retail', 'pharmacy', 'restaurant', 'drink', 'hotel', 'salon', 'gym', 'gas', 'agri', 'auto', 'realestate'];
  function renderDock() {
    $('#bizRow').innerHTML = order.map(function (k) {
      var on = k === S.biz;
      return '<button data-biz="' + k + '" aria-pressed="' + on + '" class="tactile-btn relative px-3 h-9 rounded-xl text-[11px] font-extrabold whitespace-nowrap ' + (on ? 'text-white' : 'text-slate-600 dark:text-slate-300') + '">' + SHORT[k] + '</button>';
    }).join('');

    var sc = $('#bizScroll'); sc.scrollTo({ left: on.offsetLeft - sc.clientWidth / 2 + on.offsetWidth / 2, behavior: motion ? 'smooth' : 'auto' });
  }

  /* ---------- theme and motion ---------- */
  var root = document.documentElement;
  function applyTheme(dark) { root.classList.toggle('dark', dark); root.style.colorScheme = dark ? 'dark' : 'light'; root.style.setProperty('--page', dark ? '#04070F' : '#EAEFF6'); $('#btnTheme').innerHTML = ic(dark ? 'sun' : 'moon', 'w-4 h-4 mx-auto'); }

  $('#btnTheme').addEventListener('click', function () { applyTheme(!root.classList.contains('dark')); });

})();
