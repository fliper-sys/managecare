# ManageCare - Nginx Reverse Proxy Configuration
# Deploy to: /etc/nginx/sites-available/managecare
# Enable: ln -s /etc/nginx/sites-available/managecare /etc/nginx/sites-enabled/
#
# Test: nginx -t
# Reload: systemctl reload nginx
#
# Expected DNS:
#   backend.managecare.info → VPS IP
#   app.managecare.info     → (optional) static file serving

upstream managecare_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ── HTTP (redirect to HTTPS) ────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name backend.managecare.info app.managecare.info;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name backend.managecare.info;

    # SSL — generated by certbot
    ssl_certificate     /etc/letsencrypt/live/backend.managecare.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.managecare.info/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS (optional — enable once HTTPS is confirmed working)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Max upload size (10MB for files via MinIO proxy)
    client_max_body_size 10m;

    # ── Health check (no auth needed) ─────────────────────
    location /api/health {
        proxy_pass http://managecare_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── WebSocket (Socket.IO) ─────────────────────────────
    location /socket.io/ {
        proxy_pass http://managecare_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── All API routes ────────────────────────────────────
    location / {
        proxy_pass http://managecare_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Rate limiting (optional)
        limit_req zone=api burst=20 nodelay;
    }

    # ── Error pages ───────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ── Rate limiting zone ──────────────────────────────────────
# (defined in http block of nginx.conf or here)
# limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
